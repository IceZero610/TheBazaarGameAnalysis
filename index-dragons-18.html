<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap"></noscript>
<title>The Bazaar · 构筑分析</title>
<style>
:root{
  --bg:#16110c; --bg2:#241a12;
  --panel:#201912; --panel2:#2a2017; --line:#3b2e21;
  --fg:#ece2d2; --dim:#a3907a; --faint:#6f5d46;
  --gold:#e6c067; --gold2:#f6dd97;
  --pos:#6fc28f; --neg:#e8663a; --accent:#d99a3c;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 120% at 50% 0%, var(--bg2), var(--bg) 58%);
  background-color:var(--bg);
  color:var(--fg);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}


.top{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#241a12,#16110c);
  padding:18px 26px 16px;
  box-shadow:0 1px 0 rgba(230,192,103,.12);
}
.top h1{
  margin:0 0 4px; font-family:"Cinzel",Georgia,"Times New Roman",serif;
  font-size:21px; font-weight:600; letter-spacing:.5px;
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.top h1 .hero{color:var(--gold)}
.top h1 .tag{
  font-size:11px; font-weight:500; color:var(--dim);
  border:1px solid var(--line); border-radius:999px; padding:2px 9px;
}
.sub{color:var(--dim); font-size:12.5px}
.stats{display:flex; gap:26px; margin-top:14px; flex-wrap:wrap; align-items:center}
.stat b{display:block; font-size:19px; font-weight:600; letter-spacing:.3px}
.stat span{font-size:11.5px; color:var(--dim)}
.stat.g b{color:var(--gold)}


.wrap{
  display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
  gap:clamp(12px,1.6vw,20px); padding:clamp(12px,1.6vw,18px) clamp(16px,2.4vw,30px) 0; align-items:start;
}
@media(max-width:980px){ .wrap{grid-template-columns:1fr} }
.card{
  background:linear-gradient(180deg, rgba(255,240,210,.03), transparent 42%), var(--panel);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,240,210,.05), 0 6px 22px rgba(0,0,0,.30);
}


.tabs{
  display:flex; gap:2px; padding:0 26px; margin-top:15px;
  border-bottom:1px solid var(--line);
  overflow-x:auto; scrollbar-width:thin;
}
.tab{
  -webkit-appearance:none; appearance:none; background:none; color:var(--dim);
  border:1px solid transparent; border-bottom:none; border-radius:9px 9px 0 0;
  font:inherit; font-size:13px; padding:9px 17px; cursor:pointer;
  margin-bottom:-1px; transition:color .18s ease, background .18s ease, border-color .18s ease;
}
.tab:hover{color:var(--fg)}
.tab.on{
  color:var(--gold); background:var(--panel);
  border-color:var(--line); border-bottom:1px solid var(--panel);
  box-shadow:inset 0 -2px 0 0 var(--gold);
}
.tab:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}
.pane{min-width:0; opacity:1; transition:opacity .35s ease, transform .35s ease}
.pane.fade{opacity:0; transform:translateY(10px)}
.pane[hidden]{display:none}
@media (prefers-reduced-motion: reduce){
  .pane{transition:none}
  .nr input[type=range]::-webkit-slider-thumb{transition:none}
  .nr input[type=range]:hover::-webkit-slider-thumb{transform:none}
}

.dslot{min-width:0}
.card-hd{
  padding:11px 15px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.card-hd h2{margin:0; font-size:13.5px; font-weight:600; letter-spacing:.3px}
.card-hd .hint{font-size:11.5px; color:var(--faint)}


.ctl{display:flex; gap:7px; align-items:center; flex-wrap:wrap}
input[type=search]{
  background:var(--panel2); border:1px solid var(--line); color:var(--fg);
  border-radius:7px; padding:6px 10px; font-size:12.5px; width:170px; outline:none;
}
input[type=search]:focus{border-color:var(--accent)}
button.sbtn{
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
  border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer;
  transition:color .15s ease, border-color .15s ease, background .15s ease;
}
button.sbtn:hover{color:var(--fg); border-color:#5a4631}
button.sbtn.on{background:#3a2c17; border-color:var(--gold); color:var(--gold2)}


.netRange{display:flex; flex-direction:column; gap:8px; margin:0 10px 14px}
.nr{display:flex; align-items:center; gap:10px}
.nr .nm{font-size:11.5px; color:var(--gold2); font-weight:600; letter-spacing:.5px; width:50px; flex:none}
.nr input[type=range]{
  flex:1; height:5px; -webkit-appearance:none; appearance:none;
  background:linear-gradient(90deg,#2a2017,#3b2e21); border-radius:3px; outline:none; cursor:pointer;
}
.nr.pos input[type=range]{background:linear-gradient(90deg, #6fc28f, rgba(111,194,143,.22))}
.nr.neg input[type=range]{background:linear-gradient(90deg, #e8663a, rgba(232,102,58,.22))}
.nr.chg input[type=range]{background:linear-gradient(90deg, #d99a3c, rgba(217,154,60,.22))}
.nr input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, var(--gold2), var(--gold));
  border:2px solid #1a130d; box-shadow:0 0 0 1px rgba(230,192,103,.45);
  transition:transform .15s ease;
}
.nr input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18)}
.nr input[type=range]::-moz-range-thumb{
  width:15px; height:15px; border-radius:50%; border:2px solid #1a130d;
  background:radial-gradient(circle at 35% 35%, var(--gold2), var(--gold));
  box-shadow:0 0 0 1px rgba(230,192,103,.45);
}
.nr input[type=range]:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.nr .nv{font-size:11.5px; width:96px; flex:none; text-align:right;
        font-variant-numeric:tabular-nums; transition:color .15s ease}
.nr.pos .nv{color:#8fd8b4}
.nr.neg .nv{color:#e8a48c}
.nr.chg .nv{color:#e3b272}


table{width:100%; border-collapse:collapse}
thead th{
  text-align:right; font-size:11px; font-weight:500; color:var(--faint);
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;
}
thead th.l{text-align:left}
tbody tr{cursor:pointer; border-bottom:1px solid #1e222c}
tbody tr:hover{background:#1a1f2a}
tbody tr.sel{background:#1e2740}
tbody td{padding:7px 10px; text-align:right; vertical-align:middle}
tbody td.l{text-align:left}
.cell{display:flex; align-items:center; gap:10px; min-width:0}
.thumb{
  height:34px; width:auto; aspect-ratio:var(--ar,1); flex:none; border-radius:7px; border:1px solid var(--line);
  background-size:cover; background-position:center; background-color:#0b0d11;
  position:relative; overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.cname{flex:1; min-width:0}
.cmeta{margin-left:auto; display:flex; gap:4px; flex:none; padding-left:8px}
.cname .cn{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cname .en{font-size:10.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pill{
  display:inline-block; font-size:10px; padding:1px 6px; border-radius:5px;
  background:var(--panel2); color:var(--dim); border:1px solid var(--line); white-space:nowrap;
}
.pill.tier{font-weight:600}
.t-bronze{color:#b2703b;border-color:#4a382a}
.t-silver{color:#b9c2cf;border-color:#3c4453}
.t-gold{color:#e6c067;border-color:#4f4023}
.t-diamond{color:#7fd4e8;border-color:#274a54}
.t-legendary{color:#e08bd0;border-color:#4d2b47}
.t-platinum{color:#b7a6e8;border-color:#3a3358}
.bar{display:flex; align-items:center; gap:7px; justify-content:flex-end}
.bar .track{width:52px; height:4px; background:#2a2017; border-radius:3px; overflow:hidden; flex:none}
.bar .fill{height:100%; background:var(--gold); border-radius:3px}
.bar .fill.sk{background:#6f93c4}
.bar .v{font-size:12px; width:78px; text-align:right; color:var(--fg); white-space:nowrap}
.bar .v .u{font-style:normal; font-size:9.5px; color:var(--faint); margin-right:3px}


.pager{
  display:flex; gap:7px; align-items:center; justify-content:center; flex-wrap:wrap;
  padding:10px 15px; border-top:1px solid var(--line);
}
.pager .pgi{
  font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;
  min-width:170px; text-align:center;
}
.pager .pgi b{color:var(--fg); font-weight:600}
.pager select{
  background:var(--panel2); border:1px solid var(--line); color:var(--dim);
  border-radius:7px; padding:5px 6px; font:inherit; font-size:12px; cursor:pointer; outline:none;
}
.pager select:focus{border-color:var(--accent)}
button.sbtn:disabled{opacity:.35; cursor:default}
button.sbtn:disabled:hover{color:var(--dim); border-color:var(--line)}
.num{font-size:12.5px; color:var(--dim)}
.num.hi{color:var(--fg)}



#pane-detail .dslot{max-width:1080px; margin:0 auto; padding:18px clamp(14px,2.4vw,26px) 44px}
#detail{ 
  background:linear-gradient(180deg, rgba(255,240,210,.03), transparent 42%), var(--panel);
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,240,210,.05), 0 6px 22px rgba(0,0,0,.30);
}
.detail{padding:clamp(14px,2vw,22px)}

.dhead{display:flex; gap:16px; align-items:center; margin:0 0 16px; padding:0 0 14px;
  border-bottom:1px solid var(--line)}
.dhead .thumb{height:64px; width:auto; aspect-ratio:var(--ar,1); border-radius:11px}
.dhead h3{margin:0 0 4px; font-size:19px; font-weight:600}
.dhead .en{font-size:12.5px; color:var(--faint); margin-bottom:7px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.mini{display:flex; gap:26px; margin:16px 0; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.mini div b{display:block; font-size:17px; font-weight:600}
.mini div span{font-size:11px; color:var(--dim)}

.effect{margin:16px 0; padding:13px 16px; background:var(--panel2);
  border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:9px}
.effect h4{margin:0 0 9px; font-size:12px; font-weight:600; letter-spacing:.4px; color:var(--gold2)}
.effect .etext{font-size:13.5px; line-height:1.75; color:var(--fg); white-space:pre-wrap}
.effect .etext + .etext{margin-top:9px; padding-top:9px; border-top:1px dashed var(--line)}

.cdline{display:flex; gap:9px; align-items:baseline; margin:14px 0 2px;
  font-size:13px; line-height:1.7}
.cdline .cdk{color:var(--faint); font-size:11.5px; letter-spacing:.4px; flex:none}
.cdline .cdval{color:var(--fg)}
.cdline .cdpassive{color:var(--dim); font-weight:600}

.relgrid{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; margin-top:6px}
@media(max-width:760px){ .relgrid{grid-template-columns:1fr} }
.grp{margin-bottom:15px}
.grp:last-child{margin-bottom:0}
.grp h4{
  margin:0 0 8px; font-size:12px; font-weight:600; letter-spacing:.4px;
  display:flex; align-items:center; gap:7px;
}
.dot{width:7px; height:7px; border-radius:50%; flex:none}
.grp.pos h4{color:var(--pos)} .grp.pos .dot{background:var(--pos)}
.grp.neg h4{color:var(--neg)} .grp.neg .dot{background:var(--neg)}
.grp h4 .cnt{color:var(--faint); font-weight:400; font-size:11px}
.rel{display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:8px; cursor:pointer}
.rel:hover{background:#1b212c}
.rel .thumb{height:24px; width:auto; aspect-ratio:var(--ar,1); border-radius:6px}
.rel .rn{flex:1; min-width:0; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rel .rm{font-size:10px; color:var(--faint)}
.rel .rl{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; line-height:1.2}
.rel .rl span{display:block; font-size:10px; font-weight:400; color:var(--faint)}

.tag{display:inline-block; font-size:9.5px; line-height:1.5; padding:0 4px; border-radius:4px;
     border:1px solid #4a382a; color:#b2703b; margin-left:4px; vertical-align:1px; white-space:nowrap}
.grp.pos .rl{color:var(--pos)} .grp.neg .rl{color:var(--neg)}
.flatline{display:flex; flex-wrap:wrap; gap:6px; padding:2px 13px 4px}
.flatline .fl{
  font-size:11px; color:var(--dim); background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.flatline .fl:hover{color:var(--fg); border-color:#5a4631}
.empty{padding:30px 15px; text-align:center; color:var(--faint); font-size:12.5px}

.grp.cap .rels .rel:nth-child(n+16){display:none}
.grp.cap.exp .rels .rel:nth-child(n+16){display:flex}
.more{
  display:block; width:100%; margin:9px 0 2px; padding:6px; font:inherit; font-size:11.5px;
  color:var(--dim); background:var(--panel2); border:1px solid var(--line);
  border-radius:7px; cursor:pointer;
}
.more:hover{color:var(--fg); border-color:#5a4631}


.net{margin:clamp(12px,1.6vw,18px) clamp(16px,2.4vw,28px)}
.nwrap{position:relative; height:clamp(440px, 62vh, 720px); padding:0 10px}

#net{width:100%; height:100%; touch-action:none}
#net canvas{display:block}
#net canvas.grabbable{cursor:grabbing}
.netLegend{display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  padding:2px 14px 0; font-size:11px; color:var(--dim)}
.netLegend i{display:inline-block; width:16px; height:0; border-top-width:2px;
  border-top-style:solid; vertical-align:middle; margin-right:5px}
.netLegend .ndot{display:inline-block; width:9px; height:9px; border-radius:50%;
  vertical-align:middle; margin-right:5px}
.netLegend .lk{color:var(--faint); border-left:1px solid var(--line); padding-left:14px}




.spark{flex:1 1 260px; max-width:560px; min-width:200px; margin-left:auto;
  display:flex; flex-direction:column; justify-content:center; gap:3px;
  padding-left:18px; border-left:1px solid var(--line)}
.sparkCap{font-size:10.5px; color:var(--faint); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.spark svg{display:block}
.axis{font-size:8px; fill:var(--faint)}
.vlab{font-size:8px; font-weight:600; fill:var(--gold)}
.netNote{padding:0 13px 4px; font-size:11px; color:var(--dim); line-height:1.6}
.netNote b{color:var(--gold); font-weight:600}
.foot{
  margin-top:8px; padding:16px 26px 30px; border-top:1px solid var(--line);
  font-size:11px; color:var(--faint); line-height:1.7;
}
</style>
</head>
<body>

<header class="top">
  <h1>
    The Bazaar · 构筑分析
    
    <span class="hero" id="heroName">—</span>
    <span class="tag" id="seasonTag">—</span>
    <span class="tag" id="patchTag">—</span>
  </h1>
  <div class="stats" id="statBar"></div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab on" data-pane="net" role="tab" aria-selected="true">关联网络</button>
  <button class="tab" data-pane="cards" role="tab" aria-selected="false">卡牌总表</button>
  <button class="tab" data-pane="detail" role="tab" aria-selected="false">卡牌详情</button>
</nav>

<main class="panes">

<section class="pane" id="pane-net">

<section class="card net">
  <div class="card-hd">
    <div class="ctl">
      <button class="sbtn" id="netReset">重置视图</button>
    </div>
  </div>
  
  <div class="netRange">
    <div class="nr pos">
      <span class="nm">协同</span>
      <input type="range" id="posR" min="0" max="1" step="0.001" value="0.316"
             aria-label="协同搭配分门槛：显示搭配分大于等于该值">
      <span class="nv" id="posV"></span>
    </div>
    <div class="nr neg">
      <span class="nm">排斥</span>
      <input type="range" id="negR" min="0" max="1" step="0.001" value="1.0"
             aria-label="排斥搭配分门槛：显示排斥分大于等于该值；拖到最右 = 完全隐藏排斥">
      <span class="nv" id="negV"></span>
    </div>
    <div class="nr chg">
      <span class="nm">间距</span>
      <input type="range" id="distR" min="1.5" max="5" step="0.05" value="2.5"
             aria-label="节点间距：缩放连线弹簧平衡长度，动态调节节点之间的距离">
      <span class="nv" id="distV"></span>
    </div>
  </div>
  <div class="nwrap" id="netwrap"><div id="net"></div></div>
</section>
</section>


<section class="pane" id="pane-cards" hidden>
  <section class="card">
    <div class="card-hd">
      <h2>卡牌总表 <span class="hint" id="tblCount"></span></h2>
      <div class="ctl">
        <input type="search" id="q" placeholder="搜索卡牌…">
        <button class="sbtn on" data-kind="all">全部</button>
        <button class="sbtn" data-kind="item">物品</button>
        <button class="sbtn" data-kind="skill">技能</button>
      </div>
      <div class="ctl">
        <span class="hint">排序</span>
        <button class="sbtn on" data-sort="pickRate">携带率</button>
        <button class="sbtn" data-sort="winsAvg">平均胜场</button>
        <button class="sbtn" data-sort="tenWinRate">10 胜率</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th class="l">卡牌</th>
          <th>携带率</th>
          <th>平均胜场</th>
          <th>10 胜率</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager">
      <button class="sbtn" data-pg="first" title="首页">«</button>
      <button class="sbtn" data-pg="prev">上一页</button>
      <span class="pgi" id="pgInfo"></span>
      <button class="sbtn" data-pg="next">下一页</button>
      <button class="sbtn" data-pg="last" title="末页">»</button>
      <select id="pgSize" aria-label="每页条数">
        <option value="10">10 条/页</option>
        <option value="20" selected>20 条/页</option>
        <option value="40">40 条/页</option>
        <option value="80">80 条/页</option>
        <option value="0">不分页（全部）</option>
      </select>
    </div>
  </section>
</section>


<section class="pane" id="pane-detail" hidden>
  <div class="dslot" id="slot-detail"><aside class="card" id="detail"></aside></div>
</section>

</main>

  var CUT_MAX_P=0.25;  
  var CUT_MAX_N=0.15;     
  
  var SAT_W_P=0.12, SAT_W_N=0.15;
  var TIER_C={Bronze:"#b2703b",Silver:"#c9c2b4",Gold:"#e6c067",

           pendingFit:true, userAdjusted:false, visible:true,
           hoverId:null, lblKey:null, lblSet:{}, retry:0, dropped:0, nAll:0,

  var __netLastId=null, __netLastT=0;

  
  function netPosCut(){ return CUT_MAX_P * NET.tPos * NET.tPos; }
  function netNegCut(){ return NET.cutMaxN * NET.tNeg * NET.tNeg; }
  var ART={}, curK=1;      

  
  function netBuildData(){
    var i, pick={}, items=[];
    for(i=0;i<cards.length;i++) if(cards[i].metric==="final") items.push(cards[i]);
    items.forEach(function(c){ pick[c.id]=c; });

    var maxPick=0;
    items.forEach(function(c){ if((c.pickRate||0)>maxPick) maxPick=c.pickRate; });
    maxPick=maxPick||1;

    
    var PHI_M=(M.phiM!=null?M.phiM:3), PHI_K=(M.phiK!=null?M.phiK:20);
    function pairW(c){
      var u=Math.max((c||0)-PHI_M, 0);
      return u<=0 ? 0 : u/(u+PHI_K);
    }
    
    NET.noPhi = !(DATA.pairs||[]).some(function(p){ return p.phi!=null; });
    var edges=[], maxNs=0;
    (DATA.pairs||[]).forEach(function(p){
      if(!pick[p.a] || !pick[p.b]) return;     
      var phi=p.phi||0, w=pairW(p.boards);
      var ns=Math.max(0,-phi)*w; if(ns>maxNs) maxNs=ns;
      edges.push({a:p.a, b:p.b, phi:phi, c:p.boards,
        lift:p.lift==null?1:p.lift, enough:p.enough!==false,
        score: p.score!=null ? p.score : Math.max(0,phi)*w,
        ns: ns,
        kind: phi>0 ? "pos" : "neg"});
    });
    
    var posD=[], negD=[];
    edges.forEach(function(e){
      if(e.score>0) posD.push(e.score);
      if(e.ns>0) negD.push(e.ns);
    });
    posD.sort(function(a,b){ return a-b; });
    negD.sort(function(a,b){ return a-b; });
    function q95(a, dflt){
      if(!a.length) return dflt;
      var v=a[Math.min(a.length-1, Math.round(0.95*(a.length-1)))];
      return v>0 ? v : dflt;
    }
    var satPos=q95(posD, 0.2);
    var satNeg=q95(negD, 0.04);
    NET.satPos=satPos; NET.satNeg=satNeg;
    
    NET.cutMaxN = Math.max(CUT_MAX_N, maxNs*1.02);
    var satEl=document.getElementById("netScale");
    if(satEl){
      satEl.textContent="线宽 = (搭配分 \u00f7 "+satPos.toFixed(3)+")\u00b2"+
        " \u00b7 \u2265 "+satPos.toFixed(3)+" 一律最粗（约前 5% 的边）"+
        " \u00b7 平方刻度：中等强度的边压到细线，粗线只留给强协同"+
        " \u00b7 排斥线固定压细 + 半透明（不透明度 \u2264 "+
        (AL_NEG0+AL_NEGK).toFixed(2)+"）";
    }

    edges.forEach(function(e){
      e.w = e.kind==="pos" ? Math.min(1, Math.sqrt(e.score/SAT_W_P))
          : Math.min(1, Math.sqrt(e.ns/SAT_W_N));
      
      e.vw = e.kind==="pos" ? Math.min(1, Math.pow(e.score/satPos, LW_POS_POW))
           : Math.min(1, e.ns/satNeg);
    });

    var deg={};
    edges.forEach(function(e){ deg[e.a]=(deg[e.a]||0)+1; deg[e.b]=(deg[e.b]||0)+1; });

    var nodes=[];
    Object.keys(deg).forEach(function(id){
      var c=pick[id];
      nodes.push({id:id, name:c.name||"", tier:c.tier, size:c.size, art:c.art,
        pickRate:c.pickRate, winsAvg:c.winsAvg, tenWinRate:c.tenWinRate,
        runs:c.runs, deg:deg[id],
        r:(7+11*Math.pow((c.pickRate||0)/maxPick,0.55))*FG.rScale});
    });
    
    nodes.sort(function(a,b){ return (b.deg-a.deg) || (a.id<b.id?-1:1); });

    var nid={}; nodes.forEach(function(n){ nid[n.id]=n; });
    var links=[];
    edges.forEach(function(e){
      if(!nid[e.a]||!nid[e.b]) return;
      links.push({source:nid[e.a], target:nid[e.b], phi:e.phi, c:e.c, lift:e.lift,
        score:e.score, ns:e.ns, kind:e.kind, w:e.w, vw:e.vw, enough:e.enough});
    });
    NET.nodes=nodes; NET.links=links;
    NET.nAll=items.length;
    
    netVis();
  }

  
  function netChargeStrength(n){
    
    if(!NET.visNode[n.id]) return 0;
    
    return FG.charge * (0.5 + n.r/(12*FG.rScale));
  }
  
  function netLinkDistance(l){
    return FG.dist * NET.distMul * (1/Math.pow(Math.max(l.w,0.08),1/3));
  }
  function netLinkStrength(l){
    
    if(!(l._on && l.kind==="pos")) return 0;
    var a = l.source.id!=null ? l.source.id : l.source;
    var b = l.target.id!=null ? l.target.id : l.target;
    return 1/Math.min(NET.deg[a]||1, NET.deg[b]||1);
  }
  function netReforce(){
    if(!NET.graph) return;
    NET.graph.d3Force("charge").strength(netChargeStrength);
    NET.graph.d3Force("link").strength(netLinkStrength);
    NET.graph.d3Force("link").distance(netLinkDistance);   
  }

  
  function netPreload(nodes, cb){
    var todo=nodes.filter(function(n){ return n.art && !ART[n.id]; });
    if(!todo.length) return cb();
    var need=todo.length, done=0;
    function tick(){ if(++done>=need) cb(); }
    todo.forEach(function(n){
      var im=new Image();
      im.onload=function(){ ART[n.id]=im; tick(); };
      im.onerror=tick;
      im.src=n.art;
    });
  }

  
  function makeRepel(negs){
    function force(alpha){
      for(var i=0;i<negs.length;i++){
        var e=negs[i], A=e.source, B=e.target;
        
        if(!e._on) continue;
        if(!A || !B || typeof A!=="object" || typeof B!=="object") continue;
        var dx=A.x-B.x, dy=A.y-B.y;
        var d=Math.sqrt(dx*dx+dy*dy)||0.01;
        if(d>=FG.repelR) continue;
        var dd=d<FG.repelMin?FG.repelMin:d;
        var f=(FG.repelK*FG.repelK/dd)*e.w*alpha, ux=dx/d, uy=dy/d;
        A.vx+=ux*f; A.vy+=uy*f; B.vx-=ux*f; B.vy-=uy*f;
      }
    }
    force.initialize=function(){};
    return force;
  }

  
  function makeCollide(pad){
    var nodes=[];
    function force(alpha){
      for(var i=0;i<nodes.length;i++) for(var j=i+1;j<nodes.length;j++){
        var A=nodes[i], B=nodes[j];
        
        if(!NET.visNode[A.id] || !NET.visNode[B.id]) continue;
        var dx=B.x-A.x, dy=B.y-A.y;
        var d=Math.sqrt(dx*dx+dy*dy)||0.01;
        var ca=NET.comp?NET.comp[A.id]:null, cb=NET.comp?NET.comp[B.id]:null;
        var cross=(ca!=null && cb!=null && ca!==cb);
        var need=A.r+B.r+(cross?FG.xGap*NET.distMul*FG.xMinFrac:pad);
        if(d>=need) continue;
        var f=(need-d)/d*0.5;
        A.x-=dx*f; A.y-=dy*f; B.x+=dx*f; B.y+=dy*f;
      }
    }
    force.initialize=function(n){ nodes=n; };
    return force;
  }

  
  function makePull(){
    var nodes=[];
    function force(alpha){
      var n=nodes.length, i;
      if(!n) return;
      
      var cx=NET.anchorX||0, cy=NET.anchorY||0;
      
      var gr=FG.gravR*Math.pow(NET.distMul,0.6)*1.6;
      for(i=0;i<n;i++){
        var o=nodes[i];
        if(!NET.visNode[o.id]) continue;   
        var dx=o.x-cx, dy=o.y-cy;
        var dd=Math.sqrt(dx*dx+dy*dy)||0.01;
        
        o.vx -= dx*FG.cgx*alpha;
        o.vy -= dy*FG.cgy*alpha;
        if(dd>gr){
          var f=(dd-gr)*FG.wallK;
          o.vx -= dx/dd*f; o.vy -= dy/dd*f;
        }
        var sp=Math.sqrt(o.vx*o.vx+o.vy*o.vy);
        if(sp>FG.vmax){ var s=FG.vmax/sp; o.vx*=s; o.vy*=s; }
      }
    }
    force.initialize=function(n){ nodes=n; };
    return force;
  }

  

  
  
  function makeGather(){
    function force(alpha){
      var list=NET.compList, i, j, ia, ib, a, b;
      if(!list || list.length<2) return;   
      var k=list.length, ctr=[], dv=[], nn=[], sag=[];
      for(i=0;i<k;i++){
        var c0=list[i];
        nn.push(c0.length); dv.push([0,0]); sag.push(1e9);
        if(!c0.length){ ctr.push([0,0]); continue; }
        var mx=0, my=0;
        for(j=0;j<c0.length;j++){
          mx+=c0[j].x; my+=c0[j].y;
          c0[j]._q=netChargeStrength(c0[j]);   
        }
        ctr.push([mx/c0.length, my/c0.length]);
      }
      var mi=0;
      for(i=1;i<k;i++) if(nn[i]>nn[mi]) mi=i;
      var xg=FG.xGap*NET.distMul;
      
      for(i=0;i<k;i++){
        for(j=i+1;j<k;j++){
          var A=list[i], B=list[j];
          for(ia=0;ia<A.length;ia++){
            a=A[ia];
            for(ib=0;ib<B.length;ib++){
              b=B[ib];
              var dx=b.x-a.x, dy=b.y-a.y, l=dx*dx+dy*dy;
              if(l<1e-6) l=1e-6;
              if(l<1) l=Math.sqrt(l);            
              var d=Math.sqrt(l)||0.01;
              
              var wa=a._q*alpha/l, wb=b._q*alpha/l;
              a.vx-=dx*wb; a.vy-=dy*wb;
              b.vx+=dx*wa; b.vy+=dy*wa;
              
              var need=a.r+b.r+xg, surf=d-a.r-b.r;
              if(i===mi && surf<sag[j]) sag[j]=surf;
              if(j===mi && surf<sag[i]) sag[i]=surf;
              if(d<need){
                var f=(need-d)*FG.xK; if(f>FG.xMax) f=FG.xMax;
                var ux=dx/d*f, uy=dy/d*f;
                dv[i][0]-=ux; dv[i][1]-=uy;
                dv[j][0]+=ux; dv[j][1]+=uy;
              }
            }
          }
        }
      }
      
      for(i=0;i<k;i++){
        if(i===mi || !nn[i]) continue;
        var cx=ctr[mi][0]-ctr[i][0], cy=ctr[mi][1]-ctr[i][1];
        var cd=Math.sqrt(cx*cx+cy*cy)||0.01;
        var t=(sag[i]-xg)/(0.5*xg);
        if(t<0) t=0; else if(t>1) t=1;
        var cf=FG.cohIdle+(FG.cohMax-FG.cohIdle)*t;
        dv[i][0]+=cx/cd*cf; dv[i][1]+=cy/cd*cf;
      }
      
      var imp=[], tx=0, ty=0;
      for(i=0;i<k;i++){
        if(!nn[i] || i===mi) continue;
        var sx=dv[i][0]/nn[i], sy=dv[i][1]/nn[i];
        var sp=Math.sqrt(sx*sx+sy*sy);
        if(sp>FG.gatherMax){ var s=FG.gatherMax/sp; sx*=s; sy*=s; }
        imp[i]=[sx*nn[i], sy*nn[i]];          
        tx+=imp[i][0]; ty+=imp[i][1];
      }
      if(nn[mi]){
        
        
        var mrx=dv[mi][0]-tx, mry=dv[mi][1]-ty;
        var msx=mrx/nn[mi], msy=mry/nn[mi];
        var msp=Math.sqrt(msx*msx+msy*msy);
        if(msp>FG.gatherMax){ var ms=FG.gatherMax/msp; msx*=ms; msy*=ms; }
        imp[mi]=[msx*nn[mi], msy*nn[mi]];
      }
      for(i=0;i<k;i++){
        if(!nn[i] || !imp[i]) continue;
        var px=imp[i][0]/nn[i], py=imp[i][1]/nn[i], c2=list[i];
        for(j=0;j<c2.length;j++){ c2[j].vx+=px; c2[j].vy+=py; }
      }
    }
    force.initialize=function(){};
    return force;
  }
  function makeFreeze(){
    var nodes=[];
    function force(){
      for(var i=0;i<nodes.length;i++){
        var n=nodes[i];
        if(!NET.visNode[n.id]){ n.vx=0; n.vy=0; }
      }
    }
    force.initialize=function(n){ nodes=n; };
    return force;
  }

  
  function netFocus(){ return state.sel || NET.hoverId || null; }
  
  function netDim(){ return state.sel ? DIM_SEL : (NET.hoverId ? DIM_HOVER : 0); }
  
  var DIM_HOVER=0.85, DIM_SEL=1.0, DIMK_NODE=0.85, DIMK_LINK=0.95;

  
  
  var EGO={key:"\u0000", set:{}};
  function netEgo(){
    var id=netFocus()||"";
    
    var f=id+"@"+NET.visRev;
    if(f===EGO.key) return EGO.set;
    var set={};
    if(id){
      set[id]=1;
      for(var i=0;i<NET.links.length;i++){
        var l=NET.links[i];
        if(!l._on) continue;
        if(l.source.id===id) set[l.target.id]=1;
        else if(l.target.id===id) set[l.source.id]=1;
      }
    }
    EGO.key=f; EGO.set=set;
    return set;
  }

  
  function netLinkVisible(l){
    if(!l._on) return false;
    if(NET.filter==="pos") return l.kind==="pos";
    if(NET.filter==="neg") return l.kind==="neg";
    return true;
  }

  
  function netVis(){
    var pc=netPosCut(), nc=netNegCut(), vis={}, i, l;
    for(i=0;i<NET.links.length;i++){
      l=NET.links[i];
      
      l._on = l.kind==="pos" ? (l.score>=pc) : (l.ns>=nc);
      if(l._on){ vis[l.source.id]=1; vis[l.target.id]=1; }
    }
    NET.visNode=vis;
    
    var deg={}, k;
    for(k=0;k<NET.links.length;k++){
      l=NET.links[k];
      if(l._on){ deg[l.source.id]=(deg[l.source.id]||0)+1; deg[l.target.id]=(deg[l.target.id]||0)+1; }
    }
    NET.deg=deg;
    NET.visRev++;
    netComponents();
    NET.lblKey=null;
    EGO.key="\u0000";
  }
  
  function netSnapshotAnchor(){
    var sx=0, sy=0, n=0, i, nd=NET.nodes;
    for(i=0;i<nd.length;i++){
      var o=nd[i];
      if(!NET.visNode[o.id]) continue;
      if(o.fx!=null || o.fy!=null) continue;   
      sx+=o.x; sy+=o.y; n++;
    }
    if(n){ NET.anchorX=sx/n; NET.anchorY=sy/n; }
  }

  
  function netComponents(){
    var vis=[], i, idx={}, p=[], k=0, l;
    for(i=0;i<NET.nodes.length;i++) if(NET.visNode[NET.nodes[i].id]) vis.push(NET.nodes[i]);
    for(i=0;i<vis.length;i++){ idx[vis[i].id]=k++; p.push(i); }
    function find(a){ while(p[a]!==a){ p[a]=p[p[a]]; a=p[a]; } return a; }
    for(i=0;i<NET.links.length;i++){
      l=NET.links[i];
      if(!l._on) continue;
      var a=l.source.id!=null?l.source.id:l.source, b=l.target.id!=null?l.target.id:l.target;
      if(idx[a]==null||idx[b]==null) continue;
      var ra=find(idx[a]), rb=find(idx[b]);
      if(ra!==rb) p[ra]=rb;
    }
    var map={}, list=[], comp={};
    for(i=0;i<vis.length;i++){
      var r=find(i);
      if(map[r]==null){ map[r]=list.length; list.push([]); }
      list[map[r]].push(vis[i]);
      comp[vis[i].id]=map[r];
    }
    NET.comp=comp; NET.compList=list; NET.compRev=NET.visRev;
  }
  
  function netLabelSet(){
    var f=state.sel || null;
    
    var key=(f||"")+"@"+NET.visRev;
    if(key===NET.lblKey) return NET.lblSet;
    var set={};
    if(f){
      var vis=NET.links.filter(netLinkVisible), i;
      for(i=0;i<vis.length;i++) vis[i]._vi=i;
      for(i=0;i<vis.length;i++){
        var l=vis[i];
        if((l.source.id===f||l.target.id===f) && l.w>=0.5) set[i]=1;
      }
    }
    NET.lblKey=key; NET.lblSet=set;
    return set;
  }

  
  function netFramePre(){ netLabelSet(); netEgo(); }

  
  function netNodeDim(n){
    var sel=state.sel===n.id, hov=NET.hoverId===n.id;
    return (sel||hov) ? 0 : (netEgo()[n.id] ? 0 : netDim());
  }

  function netDrawNode(n, ctx, gs){
    curK=gs||1;
    
    if(!NET.visNode[n.id]) return;
    var sel=state.sel===n.id, hov=NET.hoverId===n.id, r=n.r;
    
    var dim=netNodeDim(n);

    ctx.save();
    ctx.translate(n.x, n.y);
    ctx.scale((hov&&!RM?1.08:1)/gs, (hov&&!RM?1.08:1)/gs);
    ctx.globalAlpha = 1-DIMK_NODE*dim;   

    if(hov||sel){                                    
      ctx.beginPath(); ctx.arc(0,0,r+6,0,6.2832);
      ctx.fillStyle = sel ? "rgba(246,221,151,"+(RM?0.18:(0.14+0.06*Math.sin(performance.now()/420)))+")" : "rgba(236,226,210,.11)";
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0,0,r+1.8,0,6.2832);     
    ctx.fillStyle="#1a130d"; ctx.fill();

    var im=ART[n.id];
    if(im && im.naturalWidth){
      ctx.save();
      ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.clip();
      
      var S=im.naturalWidth;
      var ar=SIZE_AR[n.size]||1;            
      var lw=S*ar, lh=S;                    
      var s=Math.max((2*r)/lw,(2*r)/lh);    
      ctx.drawImage(im, -(lw*s)/2, -(lh*s)/2, lw*s, lh*s);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,r+1.8,0,6.2832);     
    ctx.strokeStyle = sel ? "#f6dd97" : (TIER_C[n.tier]||C_FLAT);
    ctx.lineWidth = sel ? 2.6 : 1.6;
    ctx.stroke();

    if(gs>=0.62 || sel || hov){                       
      ctx.font = '10.5px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.lineWidth=2.6; ctx.strokeStyle="#1a130d";
      ctx.strokeText(n.name, 0, r+4);
      ctx.fillStyle = sel ? "#f6dd97" : (hov ? "#ece2d2" : "#c9bba6");
      ctx.fillText(n.name, 0, r+4);
    }
    ctx.restore();
  }

  
  function netNodePointer(n, color, ctx){
    
    if(!NET.visNode[n.id]) return;
    ctx.beginPath(); ctx.arc(n.x, n.y, (n.r+4)/curK, 0, 6.2832);
    ctx.fillStyle=color; ctx.fill();
  }

  function netDrawLink(l, ctx, gs){
    var s=l.source, t=l.target;
    if(s.x==null||t.x==null || !netLinkVisible(l)) return;
    var col = l.kind==="pos" ? C_POS : C_NEG;
    var focus=netFocus();
    var hot = !focus || s.id===focus || t.id===focus;
    var dimf = hot ? 1 : (1-DIMK_LINK*netDim());
    ctx.save();
    if(l.kind==="neg"){
      
      ctx.globalAlpha = (AL_NEG0+AL_NEGK*l.vw) * dimf;
      ctx.lineWidth = (LW_NEG0+LW_NEGK*l.vw)/gs;
    } else {
      ctx.globalAlpha = (AL_POS0+AL_POSK*l.w) * dimf;
      ctx.lineWidth = (LW_POS0+LW_POSK*l.vw)/gs;   
    }
    ctx.strokeStyle = col;
    ctx.lineCap="round";
    if(l.kind==="neg") ctx.setLineDash([5/gs,4/gs]);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    var idx=l._vi;
    if(idx!=null && NET.lblSet[idx]){
      ctx.save();
      var mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
      var nx=-(t.y-s.y), ny=(t.x-s.x), nl=Math.sqrt(nx*nx+ny*ny)||1;
      var tx=mx+nx/nl*(11/gs), ty=my+ny/nl*(11/gs);
      ctx.globalAlpha = hot ? 0.95 : 0.2;
      ctx.font=(9.5/gs)+'px ui-monospace,Menlo,monospace';
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.lineWidth=2.8/gs; ctx.strokeStyle="#1a130d";
      
      var lbl=(l.kind==="pos" ? l.score : l.ns).toFixed(3);
      ctx.strokeText(lbl, tx, ty);
      ctx.fillStyle=col; ctx.fillText(lbl, tx, ty);
      ctx.restore();
    }
  }

  

  function netFitView(){ if(NET.graph) NET.graph.zoomToFit(420,46); }

  
  function netEnsure(){
    if(NET.graph) return true;
    var host=document.getElementById("net");
    if(!host || !host.clientWidth) return false;   
    NET.graph=ForceGraph()(host)
      
      .width(host.clientWidth).height(host.clientHeight)
      .backgroundColor(C_BG)
      .nodeId("id")
      
      .nodeLabel(function(){ return null; })
      .nodeCanvasObject(netDrawNode)
      .nodePointerAreaPaint(netNodePointer)
      .linkCanvasObject(netDrawLink)
      .onRenderFramePre(netFramePre)   
      .enableNodeDrag(true)
      .enableZoomInteraction(true)
      .enablePanInteraction(true)
      
      .autoPauseRedraw(true)
      .warmupTicks(FG.warm)
      .cooldownTicks(FG.cool)
      .d3AlphaDecay(FG.alpha)
      .d3VelocityDecay(FG.vel)
      .onNodeHover(function(n){
        NET.hoverId=n?n.id:null;
        
        netRepaint();
      })
      .onNodeClick(function(n){
        
        var now=Date.now(), dbl=(__netLastId===n.id && now-__netLastT<280);
        __netLastId=n.id; __netLastT=now;
        if(dbl) activateCard(n.id); else select(n.id);
      })
      .onBackgroundClick(function(){ if(state.sel) select(state.sel); })
      .onEngineStop(function(){
        
        NET.graph.d3AlphaDecay(FG.alpha);
        NET.graph.cooldownTicks(FG.cool);
        netSnapshotAnchor();                      
        netRepaint();                             
        if(NET.pendingFit && !NET.userAdjusted){ NET.pendingFit=false; netFitView(); }
      });
    host.addEventListener("wheel", function(){ NET.userAdjusted=true; }, {passive:true});
    
    host.addEventListener("mousedown", function(){
      if(!NET.hoverId) NET.userAdjusted=true;     
    });
    window.addEventListener("resize", function(){
      if(!NET.graph) return;
      var h=document.getElementById("net");
      
      if(!h || !h.clientWidth || !h.clientHeight) return;
      NET.graph.width(h.clientWidth).height(h.clientHeight);
      netW=h.clientWidth; netH=h.clientHeight;   
    });
    return true;
  }

  
  function netRepaint(){
    if(!NET.graph) return;
    try { NET.graph.zoom(NET.graph.zoom()); } catch(e){}
  }

  function netUpdate(){
    netBuildData();
    if(!netEnsure()){
      NET.retry++;
      if(NET.retry<25) setTimeout(netUpdate,120);  
      return;
    }
    NET.retry=0;
    var d={nodes:NET.nodes, links:NET.links};
    
    NET.graph.graphData(d);
    
    NET.graph.d3Force("link")
      .distance(netLinkDistance);
    netReforce();
    
    NET.graph.d3Force("repel", makeRepel(d.links.filter(function(l){ return l.kind==="neg"; })));
    NET.graph.d3Force("collide", makeCollide(FG.collidePad));
    NET.graph.d3Force("pull", makePull());
    
    NET.graph.d3Force("gather", makeGather());
    
    NET.graph.d3Force("freeze", makeFreeze());
    NET.graph.d3AlphaDecay(FG.alpha);
    NET.graph.d3VelocityDecay(FG.vel);
    NET.lblKey=null;
    NET.pendingFit=true;                         
    NET.graph.d3ReheatSimulation();
    netSnapshotAnchor();                          
    netPreload(NET.nodes, function(){});         
    netTexts();
  }

  
  function netRender(){ netRepaint(); }

  
  function netStats(){
    var visE=0, onN=0, ids={}, i, l;
    for(i=0;i<NET.links.length;i++){
      l=NET.links[i];
      if(l._on){ onN++; ids[l.source.id]=1; ids[l.target.id]=1; }
      if(netLinkVisible(l)) visE++;
    }
    return {visE:visE, onE:onN, onN:Object.keys(ids).length,
            dropped:NET.nAll-Object.keys(ids).length};
  }

  }

  
  var posR=null, posV=null, negR=null, negV=null, distR=null, distV=null;

  
  function netSlider(){
    if(!posR||!negR) return null;
    NET.tPos=parseFloat(posR.value)||0;
    NET.tNeg=parseFloat(negR.value)||0;
    netVis();
    
    if(posV) posV.textContent = NET.tPos<=0 ? "不限" : netPosCut().toFixed(3);
    if(negV) negV.textContent = NET.tNeg<=0 ? "不限"
              : (netNegCut()>=NET.cutMaxN*0.999 ? "隐藏" : netNegCut().toFixed(3));
    if(distR){ var dv=parseFloat(distR.value); NET.distMul=isFinite(dv)&&dv>0?dv:1; }
    if(distV) distV.textContent=NET.distMul.toFixed(2);
    netTexts();
    netRepaint();
    return netStats();
  }
  
  function netSettle(){
    if(!NET.graph) return;
    
    netReforce();
    NET.graph.d3AlphaDecay(SETTLE_DECAY);
    NET.graph.cooldownTicks(SETTLE_TICKS);
    NET.graph.d3ReheatSimulation();
  }
  function netSliderCommit(){
    var st=netSlider();
    netSettle();
    return st;
  }
  
  function netDistInput(){
    if(!distR) return;
    var v=parseFloat(distR.value);
    NET.distMul=isFinite(v) && v>0 ? v : 1;   
    if(distV) distV.textContent=NET.distMul.toFixed(2);
    netReforce();              
    netRepaint();
    if(NET.graph){
      NET.graph.d3AlphaDecay(SETTLE_DECAY);
      NET.graph.cooldownTicks(SETTLE_TICKS);
      NET.graph.d3ReheatSimulation();   
    }
  }
  function netDistCommit(){
    netDistInput();
    return netStats();
  }
  
  function netSettleNoReforce(){
    if(!NET.graph) return;
    NET.graph.d3AlphaDecay(SETTLE_DECAY);
    NET.graph.cooldownTicks(SETTLE_TICKS);
    NET.graph.d3ReheatSimulation();
  }

  function netBind(){
    
    posR=document.getElementById("posR"); posV=document.getElementById("posV");
    negR=document.getElementById("negR"); negV=document.getElementById("negV");
    distR=document.getElementById("distR"); distV=document.getElementById("distV");
    
    posR.value=NET_DEF.tPos; negR.value=NET_DEF.tNeg; distR.value=NET_DEF.distMul;
    Array.prototype.forEach.call(document.querySelectorAll(".net .sbtn[data-edge]"),function(b){
      b.addEventListener("click",function(){
        Array.prototype.forEach.call(
          document.querySelectorAll(".net .sbtn[data-edge]"),function(x){x.classList.remove("on");});
        b.classList.add("on"); NET.filter=b.getAttribute("data-edge");
        NET.lblKey=null; EGO.key="\u0000"; netTexts();
        
        netRepaint();
      });
    });
    
    posR.addEventListener("input", netSlider);
    negR.addEventListener("input", netSlider);
    posR.addEventListener("change", netSliderCommit);
    negR.addEventListener("change", netSliderCommit);
    distR.addEventListener("input", netDistInput);
    distR.addEventListener("change", netDistCommit);
    netSlider();
    document.getElementById("netReset").addEventListener("click",function(){
      NET.userAdjusted=false; netFitView();
    });
  }

  
  window.__net={ graph:function(){ return NET.graph; }, state:NET,
                 update:netUpdate, fit:netFitView,
                 
                 
                 def:function(){ return {tPos:NET_DEF.tPos, tNeg:NET_DEF.tNeg,
                                         cutPos:CUT_MAX_P*NET_DEF.tPos*NET_DEF.tPos,
                                         cutNeg:NET.cutMaxN*NET_DEF.tNeg*NET_DEF.tNeg,
                                         distMul:NET_DEF.distMul}; },
                 px:function(l){ return l.kind==="neg" ? (LW_NEG0+LW_NEGK*l.vw)
                                                       : (LW_POS0+LW_POSK*l.vw); },
                 alpha:function(l){ return l.kind==="neg" ? (AL_NEG0+AL_NEGK*l.vw)
                                                          : (AL_POS0+AL_POSK*l.w); },
                 scale:function(){ return {satPos:NET.satPos, satNeg:NET.satNeg,
                                           powPos:LW_POS_POW,
                                           lwPos:[LW_POS0,LW_POSK],
                                           lwNeg:[LW_NEG0,LW_NEGK]}; },
                 
                 thr:function(){ return {tPos:NET.tPos, tNeg:NET.tNeg,
                                         posCut:netPosCut(), negCut:netNegCut(),
                                         cutMaxP:CUT_MAX_P, cutMaxN:NET.cutMaxN,
                                         rev:NET.visRev}; },
                 stats:netStats,
                 
                 settle:function(){ return {decay:SETTLE_DECAY, ticks:SETTLE_TICKS,
                                            live:NET.graph?NET.graph.d3AlphaDecay():null,
                                            base:FG.alpha, baseCool:FG.cool}; },
                 settleNow:netSettle,
                 settleNoReforce:netSettleNoReforce,
                 reforce:netReforce,
                 
                 freeze:function(){ if(NET.graph) NET.graph.d3Force("freeze", makeFreeze()); },
                 unfreeze:function(){ if(NET.graph) NET.graph.d3Force("freeze", null); },
                 
                 on:function(l){ return !!l._on; },
                 vis:function(l){ return netLinkVisible(l); },
                 nodeVisible:function(n){ return !!NET.visNode[n.id]; },
                 
                 
                 setThr:function(tp,tn,commit){
                   posR.value=tp; negR.value=tn;
                   if(commit) netSliderCommit(); else netSlider();
                   return netStats();
                 },
                 cutToT:function(cut,max){
                   return Math.sqrt(Math.min(1, Math.max(0, cut/max)));
                 },
                 
                 setDist:function(mul,commit){
                   distR.value=mul;
                   if(commit) netDistCommit(); else netDistInput();
                   return netStats();
                 },
                 
                 setThrNoReforce:function(tp,tn){   
                   posR.value=tp; negR.value=tn;
                   var st=netSlider();
                   netSettleNoReforce();
                   return st;
                 },
                 
                 sel:function(){ return state.sel || null; },
                 
                 nodeAlpha:function(n){
                   var isSel=state.sel===n.id, isHover=NET.hoverId===n.id;
                   var inEgo=!!netEgo()[n.id], d=netNodeDim(n);
                   
                   return {dim:d, alpha:1-DIMK_NODE*d, inEgo:inEgo, isSel:isSel,
                           isHover:isHover, exempt:isSel||isHover||inEgo};
                 },
                 ego:function(){ return netEgo(); },
                 
                 fg:function(){ return FG; },
                 
                 dim:function(){ var s=netDim();
                   return {strength:s, hover:DIM_HOVER, sel:DIM_SEL,
                           kNode:DIMK_NODE, kLink:DIMK_LINK,
                           unrelNodeAlpha:1-DIMK_NODE*s, linkFactor:1-DIMK_LINK*s}; } };
  

  
  var SPARK_H=60;
  function renderChart(){
    var svg=document.getElementById("chart");
    var cap=document.getElementById("chartCap");
    if(!svg){ return; }
    var box=svg.parentNode;                         
    var W=Math.max(120, (box.clientWidth||320) - 20), H=SPARK_H;
    svg.setAttribute("width", W); svg.setAttribute("height", H);
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    var days=DATA.days||[];
    if(cap) cap.textContent="";
    if(!days.length){ svg.innerHTML=""; if(cap) cap.textContent="无每日样本数据"; return; }
    var c = state.sel ? byId[state.sel] : null;
    var DMIN = M.minSample||100;

    
    
    var useDays = days.filter(function(r){ return (r.boards||0) >= DMIN; });
    var dropped = days.filter(function(r){ return (r.boards||0) < DMIN; });
    if(!useDays.length){ useDays = days; dropped = []; }

    var maxD = days[days.length-1].d;
    var PL=10, PR=10, PT=10, PB=13;            
    var xs=function(d){ return PL + (d-1)/Math.max(1,maxD-1)*(W-PL-PR); };

    
    
    
    var CARD_MIN = Math.max(15, Math.round(DMIN/3));
    var series;
    if(c){
      var byd={}; (c.byDay||[]).forEach(function(x){ byd[x.d]=x; });
      series=useDays.filter(function(r){ return (r.end||0)>=CARD_MIN && byd[r.d]; })
        .map(function(r){ var x=byd[r.d];
          return {d:r.d, v:x.rate, n:x.boards, tot:r.end}; });
      if(!series.length){
        
        series=(c.byDay||[]).map(function(x){
          return {d:x.d, v:x.rate, n:x.boards, tot:null}; });
      }
    } else {
      series=useDays.map(function(r){ return {d:r.d, v:r.rate||0, n:r.boards}; });
    }

    
    var warns=[];
    if(c){
      if(series.length && series[0].tot!=null && series[0].d>1){
        warns.push('D1\u2013D'+(series[0].d-1)+' 分母不足略去');
      }
      if(series.length && series[0].tot!=null){
        var thin=days.filter(function(r){
          return (r.boards||0)>=DMIN && (r.end||0)<CARD_MIN && r.d>series[0].d; });
        if(thin.length) warns.push('中段分母不足略去');
      }
      if(series.length && series[0].tot==null){
        warns.push('样本极薄，仅供参照');
      }
    } else if(dropped.length){
      warns.push('D'+dropped[0].d+'\u2013D'+dropped[dropped.length-1].d+' 样本不足未绘');
    }
    if(!series.length){ svg.innerHTML=""; if(cap) cap.textContent="样本不足，无可绘曲线"; return; }

    
    var rawMax=Math.max.apply(null,series.map(function(s){return s.v;}))*100;
    var STEPS=[1,2,5,10,20,25], step=25;
    for(var si=0;si<STEPS.length;si++){ if(STEPS[si]*5>=rawMax){ step=STEPS[si]; break; } }
    var maxV=step*5/100;
    var ys=function(v){ return (H-PB) - Math.max(0,Math.min(1,v/maxV))*((H-PB)-PT); };

    var parts=[];
    var yBase=H-PB;                              
    
    if(!c && dropped.length){
      var xc=xs(dropped[0].d-0.5);
      parts.push('<line x1="'+xc+'" y1="PT" x2="'+xc+'" y2="'+yBase+
        '" stroke="#5a4631" stroke-width="1" stroke-dasharray="2 3"/>');
    }

    var line=series.map(function(p){ return xs(p.d)+","+ys(p.v); }).join(" ");
    parts.push('<polyline points="'+xs(series[0].d)+','+yBase+' '+line+' '+
      xs(series[series.length-1].d)+','+yBase+'" fill="rgba(224,176,85,.10)"/>');
    parts.push('<polyline points="'+line+'" fill="none" stroke="#e6c067" '+
      'stroke-width="1.6" stroke-linejoin="round"/>');
    var peak=series.reduce(function(a,b){ return b.v>a.v?b:a; },series[0]);
    parts.push('<circle cx="'+xs(peak.d)+'" cy="'+ys(peak.v)+'" r="2.4" fill="#f6dd97"/>');

    
    parts.push('<line x1="'+PL+'" y1="'+yBase+'" x2="'+(W-PR)+'" y2="'+yBase+
      '" stroke="#5a4631" stroke-width="1"/>');
    series.forEach(function(p){
      parts.push('<text class="axis" x="'+xs(p.d)+'" y="'+(yBase+9)+
        '" text-anchor="middle">'+p.d+'</text>');
    });

    
    series.forEach(function(p){
      var lx=Math.max(PL+6, Math.min(W-PR-6, xs(p.d)));
      var ly=Math.max(PT-2, ys(p.v)-3);
      parts.push('<text class="vlab" x="'+lx+'" y="'+ly+
        '" text-anchor="middle">'+(p.v*100).toFixed(0)+'%</text>');
    });
    svg.innerHTML=parts.join("");

    
    var label = c ? (c.name + " · 每日" + (c.metric==="cum"?"累计习得率":"终盘携带率"))
                  : (M.hero + " · 每日胜率");
    var capTxt = label + " · 峰值 " + (peak.v*100).toFixed(1);
    if(cap) cap.textContent=capTxt;
  }

  
  function updateHint(){}

  
  function activateCard(id){
    state.sel = id;                 
    followSel();                    
    renderTable(); renderDetail(); renderChart(); netRender(); updateHint();
    setTab("detail");               
  }

  function select(id){
    state.sel = (state.sel===id) ? null : id;
    if(state.sel) followSel();
    renderTable(); renderDetail(); renderChart(); netRender(); updateHint();
  }

  
  var TABS=["net","cards","detail"];
  var curTab="net", netW=0, netH=0;

  function netTabChanged(name){
    var host=document.getElementById("net");
    if(!host) return;
    if(name!=="net"){
      if(NET.graph) NET.graph.pauseAnimation();   
      return;
    }
    if(!NET.graph){ NET.retry=0; netUpdate(); return; }  
    var w=host.clientWidth, h=host.clientHeight;
    if(!w || !h) return;
    var moved = netW>0 && (Math.abs(w-netW)>8 || Math.abs(h-netH)>8);
    NET.graph.width(w).height(h); netW=w; netH=h;
    NET.graph.resumeAnimation();
    netRepaint();
    
    if(moved && !NET.userAdjusted) netFitView();
  }

  function setTab(name, init){
    if(TABS.indexOf(name)<0) name="net";
    curTab=name;
    TABS.forEach(function(t){
      var p=document.getElementById("pane-"+t);
      if(p) p.hidden = (t!==name);
    });
    var tp=document.getElementById("pane-"+name);
    if(tp){ tp.classList.add("fade");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ tp.classList.remove("fade"); }); }); }
    Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"),function(b){
      var on = b.getAttribute("data-pane")===name;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on?"true":"false");
    });
    
    var detail=document.getElementById("detail");
    var slot=document.getElementById("slot-"+name);
    if(detail && slot && detail.parentNode!==slot) slot.appendChild(detail);
    netTabChanged(name);
    if(!init){
      
      try{ history.replaceState(null,"","#"+name); }
      catch(e){ try{ location.hash=name; }catch(e2){} }
    }
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"),function(b){
    b.addEventListener("click", function(){ setTab(b.getAttribute("data-pane")); });
  });

  
  document.getElementById("q").addEventListener("input",function(e){
    state.q=e.target.value; state.page=1; renderTable();
  });
  
  Array.prototype.forEach.call(document.querySelectorAll("#pager [data-pg]"),function(b){
    b.addEventListener("click",function(){
      var pg=b.getAttribute("data-pg"), pages=pageCount(filteredList().length);
      goPage(pg==="first" ? 1 : pg==="last" ? pages :
             pg==="prev"  ? state.page-1 : state.page+1, true);
    });
  });
  document.getElementById("pgSize").addEventListener("change",function(e){
    state.size=parseInt(e.target.value,10)||0; state.page=1; renderTable();
  });
  
  window.__tbl={ st:function(){ return {page:state.page, size:state.size,
                                        rows:document.querySelectorAll("#rows tr").length,
                                        count:document.getElementById("tblCount").textContent,
                                        info:document.getElementById("pgInfo").innerText}; },
                 list:function(){ return filteredList().map(function(c){return c.id;}); },
                 go:function(p){ goPage(p,true); return window.__tbl.st(); },
                 select:select };
  
  
  Array.prototype.forEach.call(document.querySelectorAll(".sbtn[data-sort]"),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(
        document.querySelectorAll(".sbtn[data-sort]"),function(x){x.classList.remove("on");});
      b.classList.add("on"); state.sort=b.getAttribute("data-sort"); state.page=1; renderTable();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".sbtn[data-kind]"),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(
        document.querySelectorAll(".sbtn[data-kind]"),function(x){x.classList.remove("on");});
      b.classList.add("on"); state.kind=b.getAttribute("data-kind"); state.page=1; renderTable();
    });
  });

  
  var upd=(M.sourceUpdatedAt||"").replace("T"," ").slice(0,16);
  var wFrom=(M.windowFrom||"").replace("T"," ").slice(5,16);
  var wTo  =(M.windowTo  ||"").replace("T"," ").slice(5,16);
  renderTable(); renderDetail(); renderChart(); updateHint();
  netBind();
  
  var initTab=(location.hash||"").replace(/^#/,"");
  setTab(TABS.indexOf(initTab)>=0 ? initTab : "net", true);

  
  var __rcT; window.addEventListener("resize", function(){
    clearTimeout(__rcT); __rcT=setTimeout(renderChart, 150);
  });
})();
</script>
